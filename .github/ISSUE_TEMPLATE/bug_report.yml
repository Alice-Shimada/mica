name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ordered steps to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include any error messages or logs.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: wolfram-version
    attributes:
      label: Wolfram Desktop version
      description: Wolfram Desktop 14.1 or later is supported.
      placeholder: e.g. 14.2
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Run `node --version`.
      placeholder: e.g. v22.14.0
    validations:
      required: true
  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client
      options:
        - Codex
        - Claude Desktop
        - Cursor
        - OpenCode
        - other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: mica doctor output
      description: |
        Run `mica doctor` and paste the output in a code block below.

        Redact the auth token and dashboard token URL before pasting.
      render: shell
    validations:
      required: false
